name: BetTracker
options:
  bundleIdPrefix: com.quar33x
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Bet Tracker"
targets:
  BetTracker:
    type: application
    platform: iOS
    sources:
      - Sources/BetTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quar33x.BetTracker
    scheme:
      testTargets:
        - BetTrackerTests
  BetTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BetTrackerTests
    dependencies:
      - target: BetTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quar33x.BetTrackerTests
