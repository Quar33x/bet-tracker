name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project BetTracker.xcodeproj \
            -scheme BetTracker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project BetTracker.xcodeproj \
            -scheme BetTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BetTracker.app Payload/
          zip -qr BetTracker-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BetTracker-unsigned-ipa
          path: BetTracker-unsigned.ipa
          retention-days: 30
